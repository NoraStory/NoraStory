<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Nora Story 的个人工作台</title>
  <desc id="desc">写工具，读源码。本地优先，安静软件。底部滚动展示常用技术栈。</desc>
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#191C18" stroke-width="1" opacity=".055"/>
    </pattern>
    <path id="seal-path" d="M1240 294m-166 0a166 166 0 1 1 332 0a166 166 0 1 1-332 0"/>
    <clipPath id="ticker-clip">
      <rect x="0" y="552" width="1600" height="88"/>
    </clipPath>
    <g id="tech-line">
      <text x="0" y="615" fill="#555C51" font-family="'Cascadia Code','SFMono-Regular',Consolas,monospace" font-size="27" font-weight="600" letter-spacing="2" textLength="1500" lengthAdjust="spacing">PYTHON   RUST   C++   GO   TYPESCRIPT   SVELTE   TAURI   FASTAPI   DOCKER</text>
    </g>
  </defs>

  <style>
    .name-a{animation:rise .85s .08s both cubic-bezier(.22,1,.36,1)}
    .name-b{animation:rise .85s .22s both cubic-bezier(.22,1,.36,1)}
    .intro{animation:appear .85s .48s both ease-out}
    .meta{animation:appear .8s .65s both ease-out}
    .seal{transform-origin:1240px 294px;animation:turn 38s linear infinite}
    .line{stroke-dasharray:720;stroke-dashoffset:720;animation:draw 1.25s 1.1s ease-out forwards}
    .ticker{animation:slide 30s linear infinite}
    .cursor{animation:blink 1.3s steps(1,end) infinite}
    @keyframes rise{from{transform:translateY(30px)}to{transform:translateY(0)}}
    @keyframes appear{from{opacity:.65}to{opacity:1}}
    @keyframes turn{to{transform:rotate(360deg)}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes slide{to{transform:translateX(-1600px)}}
    @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){
      .name-a,.name-b,.intro,.meta,.seal,.line,.ticker,.cursor{animation:none!important}
      .line{stroke-dashoffset:0}
    }
  </style>

  <rect width="1600" height="640" fill="#F1F2EC"/>
  <rect width="1600" height="552" fill="url(#grid)"/>
  <path d="M88 105H1512M88 520H1512" fill="none" stroke="#191C18" stroke-width="1" opacity=".15"/>

  <g class="meta" font-family="'Cascadia Code','SFMono-Regular',Consolas,monospace" font-size="23" font-weight="600" letter-spacing="3">
    <text x="88" y="78" fill="#191C18">@NoraStory</text>
    <text x="1512" y="78" text-anchor="end" fill="#555C51">NOTES FROM A SMALL WORKBENCH</text>
  </g>

  <g font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="158" font-weight="800" letter-spacing="-7">
    <text class="name-a" x="82" y="267" fill="#191C18">Nora</text>
    <text class="name-b" x="82" y="421" fill="#C75312">Story</text>
  </g>

  <path class="line" d="M90 448H714" fill="none" stroke="#C75312" stroke-width="8"/>
  <g class="intro">
    <text x="90" y="501" fill="#191C18" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="36" font-weight="500" letter-spacing="1">我做小而锋利的工具，先给自己用。</text>
    <rect class="cursor" x="700" y="470" width="15" height="35" fill="#C75312"/>
  </g>

  <path d="M856 144V478" fill="none" stroke="#191C18" stroke-width="1" opacity=".15"/>

  <g>
    <circle cx="1240" cy="294" r="211" fill="#E4E7DD" stroke="#191C18" stroke-width="1" stroke-opacity=".15"/>
    <circle cx="1240" cy="294" r="119" fill="none" stroke="#C75312" stroke-width="2"/>
    <g class="seal">
      <text fill="#191C18" font-family="'Cascadia Code','SFMono-Regular',Consolas,monospace" font-size="23" font-weight="600" letter-spacing="3">
        <textPath xlink:href="#seal-path" href="#seal-path" textLength="1035" lengthAdjust="spacing">LOCAL FIRST · READ THE SOURCE · SMALL TOOLS · NO POPUPS · </textPath>
      </text>
    </g>
    <text x="1240" y="282" text-anchor="middle" fill="#191C18" font-family="'Cascadia Code','SFMono-Regular',Consolas,monospace" font-size="42" font-weight="700" letter-spacing="3">LOCAL</text>
    <text x="1240" y="337" text-anchor="middle" fill="#C75312" font-family="'Cascadia Code','SFMono-Regular',Consolas,monospace" font-size="42" font-weight="700" letter-spacing="3">FIRST.</text>
    <path d="M1198 365H1282" fill="none" stroke="#555C51" stroke-width="2"/>
  </g>

  <rect x="0" y="552" width="1600" height="88" fill="#E4E7DD"/>
  <path d="M0 552H1600" fill="none" stroke="#C75312" stroke-width="2"/>
  <g clip-path="url(#ticker-clip)">
    <g class="ticker">
      <use xlink:href="#tech-line" href="#tech-line" x="88"/>
      <use xlink:href="#tech-line" href="#tech-line" x="1688"/>
    </g>
  </g>
</svg>
