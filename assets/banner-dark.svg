<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-label="">
  <defs>
    <radialGradient id="gT" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="r1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dt" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity=".05"/>
    </pattern>
    <filter id="b60" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>
  <style>
    .sa{animation:rot 38s linear infinite;transform-box:fill-box;transform-origin:center}
    .sb{animation:rot 55s linear infinite reverse;transform-box:fill-box;transform-origin:center}
    .sc{animation:rot 76s linear infinite;transform-box:fill-box;transform-origin:center}
    @keyframes rot{to{transform:rotate(360deg)}}
    .tw{animation:twk 4.5s ease-in-out infinite}
    @keyframes twk{0%,100%{opacity:.12}50%{opacity:.85}}
    .f1{animation:fl 8s linear infinite}
    .f2{animation:fl 11s linear infinite}
    .f3{animation:fl 14s linear infinite}
    @keyframes fl{to{stroke-dashoffset:-280}}
    .da{animation:dra 26s ease-in-out infinite}
    @keyframes dra{0%,100%{transform:translate(0,0)}50%{transform:translate(130px,26px)}}
    .db{animation:drb 33s ease-in-out infinite}
    @keyframes drb{0%,100%{transform:translate(0,0)}50%{transform:translate(-150px,20px)}}
    .dc{animation:drc 19s ease-in-out infinite}
    @keyframes drc{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    .sh{animation:sht 15s linear infinite}
    @keyframes sht{0%{transform:translate(-240px,10px);opacity:0}5%{opacity:.9}16%{transform:translate(1750px,340px);opacity:0}100%{transform:translate(1750px,340px);opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <rect width="1600" height="520" fill="#0b0e13"/>
  <rect width="1600" height="520" fill="url(#dt)"/>

  <g filter="url(#b60)">
    <ellipse class="da" cx="430" cy="170" rx="430" ry="150" fill="url(#gT)"/>
    <ellipse class="db" cx="1150" cy="140" rx="400" ry="140" fill="url(#gR)"/>
    <ellipse class="da" cx="820" cy="430" rx="480" ry="120" fill="url(#gA)"/>
  </g>

  <g fill="#e6edf3">
    <circle class="tw" cx="120" cy="90" r="1.6" style="animation-delay:-.6s;animation-duration:3.8s"/>
    <circle class="tw" cx="245" cy="150" r="1.2" style="animation-delay:-2.1s;animation-duration:5.2s"/>
    <circle class="tw" cx="420" cy="70" r="1.8" style="animation-delay:-1.3s;animation-duration:4.4s"/>
    <circle class="tw" cx="560" cy="130" r="1.1" style="animation-delay:-3.4s;animation-duration:6.1s"/>
    <circle class="tw" cx="760" cy="60" r="1.5" style="animation-delay:-.9s;animation-duration:4.9s"/>
    <circle class="tw" cx="905" cy="115" r="1.2" style="animation-delay:-2.8s;animation-duration:5.6s"/>
    <circle class="tw" cx="1050" cy="70" r="1.7" style="animation-delay:-1.7s;animation-duration:4.1s"/>
    <circle class="tw" cx="1205" cy="55" r="1.1" style="animation-delay:-3.9s;animation-duration:6.4s"/>
    <circle class="tw" cx="1420" cy="95" r="1.5" style="animation-delay:-2.4s;animation-duration:5s"/>
    <circle class="tw" cx="1525" cy="150" r="1.2" style="animation-delay:-.3s;animation-duration:4.6s"/>
    <circle class="tw" cx="655" cy="200" r="1" style="animation-delay:-1.9s;animation-duration:5.9s"/>
    <circle class="tw" cx="85" cy="210" r="1.3" style="animation-delay:-2.9s;animation-duration:4.2s"/>
  </g>

  <g class="sh">
    <line x1="0" y1="0" x2="76" y2="22" stroke="#e6edf3" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <path class="dc" d="M-20 280 C 320 170, 660 350, 980 240 S 1460 170, 1640 270" fill="none" stroke="url(#r1)" stroke-width="110" stroke-opacity=".1" stroke-linecap="round"/>

  <path class="f1" d="M-20 300 C 300 180, 600 340, 900 240 S 1400 160, 1640 260" fill="none" stroke="url(#r1)" stroke-width="2.5" stroke-dasharray="12 18"/>
  <path class="f2" d="M-20 240 C 280 340, 620 180, 940 300 S 1420 340, 1640 220" fill="none" stroke="url(#r2)" stroke-width="2" stroke-dasharray="4 22" stroke-opacity=".8"/>
  <path class="f3" d="M-20 345 C 320 260, 640 385, 960 300 S 1440 240, 1640 320" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="2 16" stroke-opacity=".55"/>

  <path fill="url(#gT)" opacity=".16">
    <animate attributeName="d" dur="16s" repeatCount="indefinite"
      values="M-20 520 L-20 380 C 300 320, 700 420, 1100 360 S 1500 320, 1640 380 L1640 520 Z;
              M-20 520 L-20 355 C 300 405, 700 330, 1100 392 S 1500 355, 1640 350 L1640 520 Z;
              M-20 520 L-20 380 C 300 320, 700 420, 1100 360 S 1500 320, 1640 380 L1640 520 Z"/>
  </path>

  <path d="M0 520 L0 425 L170 378 L330 438 L520 398 L700 448 L900 408 L1100 458 L1300 418 L1500 458 L1600 438 L1600 520 Z" fill="#12161d"/>
  <path d="M0 520 L0 468 L220 438 L420 480 L640 448 L880 484 L1120 452 L1360 486 L1600 462 L1600 520 Z" fill="#1a212c"/>

  <g fill="none">
    <circle class="sa" cx="1280" cy="245" r="62" stroke="#2dd4bf" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="3 10"/>
    <circle class="sb" cx="1280" cy="245" r="112" stroke="#fb7185" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="3 12"/>
    <circle class="sc" cx="1280" cy="245" r="164" stroke="#fbbf24" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="3 14"/>
  </g>
  <circle class="tw" cx="1280" cy="245" r="7" fill="#f1f5f9"/>
  <circle r="6" fill="#2dd4bf">
    <animateMotion dur="22s" repeatCount="indefinite" path="M1280 245 m-112 0 a112 112 0 1 1 224 0 a112 112 0 1 1 -224 0"/>
  </circle>
  <circle r="5" fill="#fb7185">
    <animateMotion dur="36s" repeatCount="indefinite" path="M1280 245 m-164 0 a164 164 0 1 0 328 0 a164 164 0 1 0 -328 0"/>
  </circle>
  <circle r="3.5" fill="#fbbf24">
    <animateMotion dur="14s" repeatCount="indefinite" path="M1280 245 m-62 0 a62 62 0 1 1 124 0 a62 62 0 1 1 -124 0"/>
  </circle>
</svg>
