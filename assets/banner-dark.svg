<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">会绘制工具路径的机械绘图机动画</title>
  <desc id="desc">一张工程笔记风格的横幅。机械绘图机画出一条锋利信号线，齿轮与状态灯同步运动。</desc>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#3a3833" opacity=".45"/>
    </pattern>
    <pattern id="paperGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#3a3833" stroke-width="1" opacity=".48"/>
    </pattern>
    <clipPath id="paperClip"><rect x="824" y="154" width="644" height="188" rx="2"/></clipPath>
  </defs>

  <rect width="1600" height="480" fill="#171715"/>
  <rect width="1600" height="480" fill="url(#dots)"/>
  <rect x="20" y="20" width="1560" height="440" rx="4" fill="none" stroke="#504d46" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="70" y="72" fill="#9b968b" font-size="13" letter-spacing="3.4">现场笔记 / 01</text>
    <text x="70" y="103" fill="#ff6b48" font-size="12" letter-spacing="2.2">一台会画工具路径的小机器</text>

    <g font-family="'Noto Serif CJK SC', 'Source Han Serif SC', 'Songti SC', SimSun, serif" font-weight="700" letter-spacing="1.5">
      <text x="68" y="213" fill="#f1ebdd" font-size="76">小而锋利，</text>
      <text x="68" y="289" fill="#f1ebdd" font-size="76">从底层做起。</text>
    </g>

    <path d="M70 322H632" stroke="#504d46" stroke-width="1"/>
    <text x="70" y="356" fill="#9b968b" font-size="15" letter-spacing="1.2">先给自己的机器用。</text>
    <rect x="322" y="342" width="10" height="17" fill="#ff6b48">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.42;.48;.9;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>

    <g font-size="11" letter-spacing="1.4">
      <rect x="70" y="389" width="132" height="30" rx="2" fill="none" stroke="#504d46"/>
      <circle cx="88" cy="404" r="4" fill="#7eb0ff"/>
      <text x="102" y="408" fill="#f1ebdd">本地优先</text>

      <rect x="216" y="389" width="162" height="30" rx="2" fill="none" stroke="#504d46"/>
      <circle cx="234" cy="404" r="4" fill="#f0c84b">
        <animate attributeName="opacity" values=".25;1;.25" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <text x="248" y="408" fill="#f1ebdd">读懂源码</text>

      <rect x="392" y="389" width="158" height="30" rx="2" fill="none" stroke="#504d46"/>
      <circle cx="410" cy="404" r="4" fill="#ff6b48">
        <animate attributeName="opacity" values="1;.25;1" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <text x="424" y="408" fill="#f1ebdd">安静软件</text>
    </g>
  </g>

  <g>
    <rect x="704" y="63" width="824" height="354" rx="4" fill="#211f1c" stroke="#504d46" stroke-width="2"/>
    <path d="M704 116H1528" stroke="#504d46" stroke-width="2"/>
    <path d="M704 370H1528" stroke="#504d46" stroke-width="2"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="730" y="93" fill="#9b968b" font-size="12" letter-spacing="2.5">绘图机 / MARK I</text>
      <text x="1452" y="93" fill="#7eb0ff" font-size="11" letter-spacing="1.8">信号正常</text>
      <circle cx="1434" cy="89" r="4" fill="#7eb0ff">
        <animate attributeName="r" values="3;5;3" dur="1.8s" repeatCount="indefinite"/>
      </circle>

      <text x="730" y="397" fill="#9b968b" font-size="10" letter-spacing="1.8">绘制</text>
      <circle cx="780" cy="393" r="4" fill="#ff6b48">
        <animate attributeName="opacity" values="1;.18;.18;1" keyTimes="0;.32;.66;1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <text x="800" y="397" fill="#9b968b" font-size="10" letter-spacing="1.8">测试</text>
      <circle cx="850" cy="393" r="4" fill="#f0c84b">
        <animate attributeName="opacity" values=".18;1;.18;.18" keyTimes="0;.32;.66;1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <text x="870" y="397" fill="#9b968b" font-size="10" letter-spacing="1.8">发布</text>
      <circle cx="920" cy="393" r="4" fill="#7eb0ff">
        <animate attributeName="opacity" values=".18;.18;1;.18" keyTimes="0;.32;.66;1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <text x="940" y="397" fill="#9b968b" font-size="10" letter-spacing="1.8">循环</text>
      <text x="1352" y="397" fill="#9b968b" font-size="10" letter-spacing="1.8">工具路径 / 0x2A</text>
    </g>

    <rect x="824" y="154" width="644" height="188" rx="2" fill="#1c1b19" stroke="#504d46"/>
    <rect x="824" y="154" width="644" height="188" rx="2" fill="url(#paperGrid)"/>

    <g clip-path="url(#paperClip)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M840 310C900 252 948 326 1014 278S1118 177 1184 233S1284 324 1370 239S1458 166 1518 211" stroke="#504d46" stroke-width="1" stroke-dasharray="5 7" opacity=".55"/>
      <path d="M840 310C900 252 948 326 1014 278S1118 177 1184 233S1284 324 1370 239S1458 166 1518 211" pathLength="1000" stroke="#ff6b48" stroke-width="3" stroke-dasharray="1000" stroke-dashoffset="1000">
        <animate attributeName="stroke-dashoffset" values="1000;0;0;1000" keyTimes="0;.72;.9;1" dur="10s" repeatCount="indefinite"/>
      </path>
      <circle cx="1014" cy="278" r="4" fill="#1c1b19" stroke="#7eb0ff" stroke-width="2"/>
      <circle cx="1184" cy="233" r="4" fill="#1c1b19" stroke="#7eb0ff" stroke-width="2"/>
      <circle cx="1370" cy="239" r="4" fill="#1c1b19" stroke="#7eb0ff" stroke-width="2"/>
    </g>

    <g>
      <rect x="0" y="0" width="38" height="46" rx="3" fill="#f1ebdd">
        <animateTransform attributeName="transform" type="translate" values="817 124;1160 124;1500 124;817 124" keyTimes="0;.38;.76;1" dur="10s" repeatCount="indefinite"/>
      </rect>
      <line x1="0" y1="46" x2="0" y2="0" stroke="#f1ebdd" stroke-width="3">
        <animateTransform attributeName="transform" type="translate" values="836 124;1179 124;1519 124;836 124" keyTimes="0;.38;.76;1" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="186;106;86;186" keyTimes="0;.38;.76;1" dur="10s" repeatCount="indefinite"/>
      </line>
    </g>

    <circle r="7" fill="#ff6b48" stroke="#1c1b19" stroke-width="3">
      <animateMotion dur="10s" repeatCount="indefinite" path="M840 310C900 252 948 326 1014 278S1118 177 1184 233S1284 324 1370 239S1458 166 1518 211"/>
    </circle>

    <g transform="translate(805 135)">
      <rect width="710" height="8" rx="4" fill="#f1ebdd" opacity=".82"/>
      <g fill="#9b968b">
        <rect x="30" y="13" width="2" height="8"/><rect x="92" y="13" width="2" height="8"/><rect x="154" y="13" width="2" height="8"/><rect x="216" y="13" width="2" height="8"/><rect x="278" y="13" width="2" height="8"/><rect x="340" y="13" width="2" height="8"/><rect x="402" y="13" width="2" height="8"/><rect x="464" y="13" width="2" height="8"/><rect x="526" y="13" width="2" height="8"/><rect x="588" y="13" width="2" height="8"/><rect x="650" y="13" width="2" height="8"/>
      </g>
    </g>

    <g transform="translate(1487 334)">
      <circle r="24" fill="none" stroke="#504d46" stroke-width="2"/>
      <circle r="8" fill="none" stroke="#f1ebdd" stroke-width="3"/>
      <g stroke="#f1ebdd" stroke-width="3">
        <path d="M0-18V-9M0 9V18M-18 0H-9M9 0H18M-13-13L-6-6M6 6L13 13M13-13L6-6M-6 6L-13 13"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 1487 334" to="360 1487 334" dur="9s" repeatCount="indefinite" additive="sum"/>
    </g>

    <g transform="translate(1115 385) rotate(-7)" opacity=".78">
      <rect x="0" y="0" width="136" height="24" fill="none" stroke="#ff6b48" stroke-width="2"/>
      <text x="9" y="17" fill="#ff6b48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.4">无遥测</text>
      <animate attributeName="opacity" values=".55;.9;.55" dur="4.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <g stroke="#504d46" stroke-width="1">
    <path d="M666 63V417"/>
    <path d="M654 63H678M654 417H678"/>
    <path d="M669 120H681M669 176H681M669 232H681M669 288H681M669 344H681M669 400H681"/>
  </g>
</svg>
